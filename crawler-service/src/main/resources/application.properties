spring.application.name=crawler-service

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Redis queue
crawler.queue.key=crawler:urls:pending
crawler.discovered.key=crawler:urls:discovered

# Crawl depth
crawler.max-depth=2

# Executor
crawler.executor.pool-size=100
crawler.executor.queue-capacity=500

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

crawler.kafka.topic=crawl-results